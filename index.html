<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Паша грунт — падающие листья</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Pacifico&family=Press+Start+2P&family=Caveat:wght@700&family=Righteous&family=Permanent+Marker&family=Bebas+Neue&family=Comfortaa:wght@700&family=Fredoka:wght@700&family=Orbitron:wght@800&family=Shrikhand&family=Yeseva+One&family=Rubik+Mono+One&family=Great+Vibes&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #4b0082, #0f3460, #3d0e61, #001f3f);
    background-size: 400% 400%;
    animation: bgShift 18s ease infinite;
    cursor: pointer;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #stage {
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  .leaf {
    position:absolute;
    top:-10vh;
    white-space:nowrap;
    will-change: transform, opacity;
    pointer-events:none;
    filter: drop-shadow(0 0 6px currentColor);
    user-select:none;
  }

  #hint {
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    color:#ffffffaa;
    font-family: sans-serif;
    font-size:13px;
    letter-spacing:0.5px;
    pointer-events:none;
    text-align:center;
    animation: fadeHint 4s ease forwards;
  }
  @keyframes fadeHint {
    0%   { opacity:1; }
    80%  { opacity:1; }
    100% { opacity:0; }
  }

  #speedBadge {
    position:fixed;
    top:16px;
    right:18px;
    font-family: sans-serif;
    font-weight:700;
    font-size:14px;
    color:#fff;
    background:rgba(255,255,255,0.12);
    padding:6px 12px;
    border-radius:999px;
    backdrop-filter: blur(4px);
    pointer-events:none;
    opacity:0;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #speedBadge.show { opacity:1; }
</style>
</head>
<body>
  <div id="hint">нажми в любом месте — ускорение x2</div>
  <div id="speedBadge">x1</div>
  <div id="stage"></div>

<script>
  const fonts = [
    "'Bangers', cursive",
    "'Pacifico', cursive",
    "'Press Start 2P', monospace",
    "'Caveat', cursive",
    "'Righteous', sans-serif",
    "'Permanent Marker', cursive",
    "'Bebas Neue', sans-serif",
    "'Comfortaa', sans-serif",
    "'Fredoka', sans-serif",
    "'Orbitron', sans-serif",
    "'Shrikhand', cursive",
    "'Yeseva One', serif",
    "'Rubik Mono One', sans-serif",
    "'Great Vibes', cursive",
    "'Black Ops One', sans-serif"
  ];

  const colors = [
    "#ff2e63", "#00fff5", "#ffdc00", "#39ff14", "#ff6f61",
    "#f39c12", "#c2185b", "#61dafb", "#ffd700", "#ee4540",
    "#00ff88", "#ff00ff", "#f6f5f2", "#d90429", "#8f00ff"
  ];

  const stage = document.getElementById('stage');
  const speedBadge = document.getElementById('speedBadge');
  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  let speedMultiplier = 1;
  let badgeTimeout;

  document.body.addEventListener('click', () => {
    speedMultiplier = speedMultiplier === 1 ? 2 : 1;
    speedBadge.textContent = 'x' + speedMultiplier;
    speedBadge.classList.add('show');
    clearTimeout(badgeTimeout);
    badgeTimeout = setTimeout(() => speedBadge.classList.remove('show'), 1200);
  });

  class Leaf {
    constructor() {
      this.reset(true);
    }
    reset(initial) {
      this.font = fonts[Math.floor(Math.random() * fonts.length)];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.size = 18 + Math.random() * 34;
      this.x = Math.random() * (W() - 200);
      this.y = initial ? Math.random() * -H() : -60 - Math.random() * 200;
      this.baseSpeed = 0.6 + Math.random() * 1.4;
      this.swayAmp = 20 + Math.random() * 60;
      this.swayFreq = 0.005 + Math.random() * 0.01;
      this.swayPhase = Math.random() * Math.PI * 2;
      this.rot = Math.random() * 360;
      this.rotSpeed = (Math.random() - 0.5) * 1.5;
      this.opacity = 0.55 + Math.random() * 0.45;

      if (!this.el) {
        this.el = document.createElement('div');
        this.el.className = 'leaf';
        this.el.textContent = 'Паша грунт';
        stage.appendChild(this.el);
      }
      this.el.style.fontFamily = this.font;
      this.el.style.fontSize = this.size + 'px';
      this.el.style.color = this.color;
      this.el.style.opacity = this.opacity;
    }
    update(time) {
      this.y += this.baseSpeed * speedMultiplier;
      this.rot += this.rotSpeed * speedMultiplier;
      const sway = Math.sin(time * this.swayFreq + this.swayPhase) * this.swayAmp;
      const drawX = this.x + sway;

      this.el.style.transform =
        'translate(' + drawX + 'px,' + this.y + 'px) rotate(' + this.rot + 'deg)';

      if (this.y > H() + 80) {
        this.reset(false);
      }
    }
  }

  const LEAF_COUNT = 28;
  const leaves = [];
  for (let i = 0; i < LEAF_COUNT; i++) leaves.push(new Leaf());

  function loop(time) {
    for (const leaf of leaves) leaf.update(time);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
